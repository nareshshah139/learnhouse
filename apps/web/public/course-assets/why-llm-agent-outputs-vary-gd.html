  background-color: var(--card);

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    @media (prefers-reduced-motion: reduce) {

        transition: none;
      }
    }
  &lt;/style&gt;

  &lt;div class=&quot;ak-head&quot;&gt;
    &lt;div class=&quot;ak-teacher&quot;&gt;
      &lt;div class=&quot;ak-avatar&quot; aria-hidden=&quot;true&quot;&gt;NS&lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;ak-course&quot;&gt;Delivered by Naresh Shah · Grid Dynamics&lt;/div&gt;
        &lt;div class=&quot;text-small text-muted&quot;&gt;Tokens → trajectories → tools → reliable effects&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ak-progress&quot; id=&quot;ak-progress&quot; aria-label=&quot;Lesson progress&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;ak-teaching-line&quot; id=&quot;ak-teaching-line&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;main class=&quot;ak-stage&quot; id=&quot;ak-stage&quot;&gt;&lt;/main&gt;

  &lt;div class=&quot;ak-nav&quot;&gt;
    &lt;span class=&quot;text-small text-muted&quot; id=&quot;ak-step-count&quot;&gt;&lt;/span&gt;
    &lt;div class=&quot;ak-nav-actions&quot;&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; id=&quot;ak-back&quot;&gt;Back&lt;/button&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot; id=&quot;ak-next&quot;&gt;Next&lt;/button&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;ak-llm-agent-lab&#x27;);
      const stage = root.querySelector(&#x27;#ak-stage&#x27;);
      const teachingLine = root.querySelector(&#x27;#ak-teaching-line&#x27;);
      const progress = root.querySelector(&#x27;#ak-progress&#x27;);
      const count = root.querySelector(&#x27;#ak-step-count&#x27;);
      const back = root.querySelector(&#x27;#ak-back&#x27;);
      const next = root.querySelector(&#x27;#ak-next&#x27;);

      const state = {
        step: 0,
        temperature: 0.8,
        topP: 0.92,
        sampleRun: 0,
        seedLocked: false,
        trajectoryRun: 0,
        liveWorld: true,
        parallel: true,
        approval: false,
        guardrails: true,
        idempotency: true,
        profile: &#x27;reliable&#x27;,
        api: &#x27;responses&#x27;
      };

      const lessonLines = [
        &#x27;A language model emits a probability distribution. The application chooses how to sample it.&#x27;,
        &#x27;One early token changes the next context; local randomness becomes global trajectory divergence.&#x27;,
        &#x27;An agent is a model inside a loop with tools, observations, concurrency, approvals, and a changing world.&#x27;,
        &#x27;Reliability is layered: reduce input ambiguity, constrain generation, govern actions, and validate effects.&#x27;,
        &#x27;Retries are normal. Duplicate real-world effects are the bug.&#x27;,
        &#x27;Creativity knobs widen the search; reliability controls bound, observe, and validate it.&#x27;,
        &#x27;OpenAI-compatible syntax is not a promise of equivalent state, tools, schemas, streaming, or reproducibility.&#x27;
      ];

      const titles = [
        &#x27;1 · The next-token lottery&#x27;,
        &#x27;2 · Autoregressive butterfly effect&#x27;,
        &#x27;3 · Why agent trajectories diverge&#x27;,
        &#x27;4 · The layered reliability stack&#x27;,
        &#x27;5 · Durable execution and safe retries&#x27;,
        &#x27;6 · API controls: reliability ↔ creativity&#x27;,
        &#x27;7 · API structure deviations and their impact&#x27;
      ];

      const esc = (value) =&gt; String(value)
        .replaceAll(&#x27;&amp;&#x27;, &#x27;&amp;amp;&#x27;)
        .replaceAll(&#x27;&lt;&#x27;, &#x27;&amp;lt;&#x27;)
        .replaceAll(&#x27;&gt;&#x27;, &#x27;&amp;gt;&#x27;)
        .replaceAll(&#x27;&quot;&#x27;, &#x27;&amp;quot;&#x27;)
        .replaceAll(&quot;&#x27;&quot;, &#x27;&amp;#039;&#x27;);

      function mulberry32(seed) {
        let value = seed &gt;&gt;&gt; 0;
        return function random() {
          value += 0x6D2B79F5;
          let nextValue = value;
          nextValue = Math.imul(nextValue ^ nextValue &gt;&gt;&gt; 15, nextValue | 1);
          nextValue ^= nextValue + Math.imul(nextValue ^ nextValue &gt;&gt;&gt; 7, nextValue | 61);
          return ((nextValue ^ nextValue &gt;&gt;&gt; 14) &gt;&gt;&gt; 0) / 4294967296;
        };
      }

      function distribution() {
        const source = [
          { token: &#x27;careful&#x27;, logit: 2.55 },
          { token: &#x27;clear&#x27;, logit: 2.20 },
          { token: &#x27;short&#x27;, logit: 1.75 },
          { token: &#x27;novel&#x27;, logit: 1.28 },
          { token: &#x27;risky&#x27;, logit: 0.62 }
        ];
        const temp = Math.max(0.05, state.temperature);
        const exponentials = source.map(item =&gt; Math.exp(item.logit / temp));
        const total = exponentials.reduce((sum, value) =&gt; sum + value, 0);
        const withProb = source.map((item, index) =&gt; ({
          ...item,
          probability: exponentials[index] / total
        })).sort((a, b) =&gt; b.probability - a.probability);
        let cumulative = 0;
        let retained = 0;
        withProb.forEach((item, index) =&gt; {
          if (cumulative &lt; state.topP || index === 0) {
            item.kept = true;
            cumulative += item.probability;
            retained += item.probability;
          } else {
            item.kept = false;
          }
        });
        return withProb.map(item =&gt; ({
          ...item,
          sampleProbability: item.kept ? item.probability / retained : 0
        }));
      }

      function sampleToken(items, random) {
        const threshold = random();
        let cumulative = 0;
        for (const item of items) {
          cumulative += item.sampleProbability;
          if (threshold &lt;= cumulative &amp;&amp; item.kept) return item.token;
        }
        return items.find(item =&gt; item.kept).token;
      }

      function sampleSequence(seed, length = 4) {
        const random = mulberry32(seed);
        const items = distribution();
        return Array.from({ length }, () =&gt; sampleToken(items, random));
      }

      function lessonShell(status = &#x27;&#x27;) {
        return `
          &lt;div class=&quot;ak-lesson-title&quot;&gt;
            &lt;h2&gt;${titles[state.step]}&lt;/h2&gt;
            ${status ? `&lt;span class=&quot;viz-badge&quot;&gt;${esc(status)}&lt;/span&gt;` : &#x27;&#x27;}
          &lt;/div&gt;
        `;
      }

      function renderProgress() {
        progress.innerHTML = titles.map((_, index) =&gt; `
          &lt;span class=&quot;ak-progress-mark ${index === state.step ? &#x27;is-current&#x27; : &#x27;&#x27;}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;
        `).join(&#x27;&#x27;);
        teachingLine.textContent = lessonLines[state.step];
        count.textContent = `Step ${state.step + 1} of ${titles.length}`;
        back.disabled = state.step === 0;
        next.textContent = state.step === titles.length - 1 ? &#x27;Start over&#x27; : &#x27;Next&#x27;;
      }

      function renderSampler() {
        const items = distribution();
        const maxProbability = Math.max(...items.map(item =&gt; item.probability));
        const runA = sampleSequence(1801 + state.sampleRun * 23);
        const runB = sampleSequence(9127 + state.sampleRun * 47);
        stage.innerHTML = `
          ${lessonShell(`T ${state.temperature.toFixed(2)} · top-p ${state.topP.toFixed(2)}`)}
          &lt;div class=&quot;ak-two-col&quot;&gt;
            &lt;section aria-label=&quot;Next token probabilities&quot;&gt;
              &lt;h3&gt;Candidate tokens&lt;/h3&gt;
              &lt;div class=&quot;ak-prob-list&quot; style=&quot;margin-top: 12px;&quot;&gt;
                ${items.map(item =&gt; `
                  &lt;div class=&quot;ak-token-row ${item.kept ? &#x27;&#x27; : &#x27;is-cut&#x27;}&quot;&gt;
                    &lt;span class=&quot;ak-token-name&quot;&gt;${item.token}&lt;/span&gt;
                    &lt;div class=&quot;ak-bar-track&quot; aria-hidden=&quot;true&quot;&gt;
                      &lt;div class=&quot;ak-bar-fill&quot; style=&quot;width: ${(item.probability / maxProbability * 100).toFixed(1)}%&quot;&gt;&lt;/div&gt;
                    &lt;/div&gt;
                    &lt;span class=&quot;ak-token-value text-end&quot;&gt;${Math.round(item.probability * 100)}%&lt;/span&gt;
                  &lt;/div&gt;
                `).join(&#x27;&#x27;)}
              &lt;/div&gt;
              &lt;div class=&quot;ak-divider-labels text-small&quot;&gt;
                &lt;span&gt;retained tokens&lt;/span&gt;&lt;span&gt;struck out by top-p&lt;/span&gt;
              &lt;/div&gt;
            &lt;/section&gt;
            &lt;section class=&quot;ak-controls-stack&quot; aria-label=&quot;Sampling controls&quot;&gt;
              &lt;div class=&quot;viz-controls&quot;&gt;
                &lt;label class=&quot;form-label&quot; for=&quot;ak-temperature&quot;&gt;
                  Temperature &lt;strong&gt;${state.temperature.toFixed(2)}&lt;/strong&gt;
                  &lt;input class=&quot;form-range&quot; id=&quot;ak-temperature&quot; type=&quot;range&quot; min=&quot;0.1&quot; max=&quot;1.6&quot; step=&quot;0.05&quot; value=&quot;${state.temperature}&quot;&gt;
                &lt;/label&gt;
                &lt;label class=&quot;form-label&quot; for=&quot;ak-top-p&quot;&gt;
                  Top-p &lt;strong&gt;${state.topP.toFixed(2)}&lt;/strong&gt;
                  &lt;input class=&quot;form-range&quot; id=&quot;ak-top-p&quot; type=&quot;range&quot; min=&quot;0.45&quot; max=&quot;1&quot; step=&quot;0.01&quot; value=&quot;${state.topP}&quot;&gt;
                &lt;/label&gt;
                &lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot; id=&quot;ak-resample&quot;&gt;Sample twice&lt;/button&gt;
              &lt;/div&gt;
              &lt;div class=&quot;ak-traces&quot; aria-label=&quot;Two sampled outputs&quot;&gt;
                &lt;div class=&quot;ak-trace&quot;&gt;
                  &lt;span class=&quot;ak-trace-label&quot;&gt;Run A&lt;/span&gt;
                  ${runA.map(token =&gt; `&lt;span class=&quot;ak-token&quot;&gt;${token}&lt;/span&gt;`).join(&#x27;&lt;span class=&quot;ak-arrow&quot;&gt;→&lt;/span&gt;&#x27;)}
                &lt;/div&gt;
                &lt;div class=&quot;ak-trace&quot;&gt;
                  &lt;span class=&quot;ak-trace-label&quot;&gt;Run B&lt;/span&gt;
                  ${runB.map(token =&gt; `&lt;span class=&quot;ak-token alt&quot;&gt;${token}&lt;/span&gt;`).join(&#x27;&lt;span class=&quot;ak-arrow&quot;&gt;→&lt;/span&gt;&#x27;)}
                &lt;/div&gt;
              &lt;/div&gt;
            &lt;/section&gt;
          &lt;/div&gt;
          &lt;div class=&quot;ak-selected-detail text-small&quot;&gt;Lower temperature concentrates probability; top-p removes the tail. Neither proves factual correctness.&lt;/div&gt;
        `;
        stage.querySelector(&#x27;#ak-temperature&#x27;).addEventListener(&#x27;input&#x27;, event =&gt; {
          state.temperature = Number(event.target.value);
          render();
        });
        stage.querySelector(&#x27;#ak-top-p&#x27;).addEventListener(&#x27;input&#x27;, event =&gt; {
          state.topP = Number(event.target.value);
          render();
        });
        stage.querySelector(&#x27;#ak-resample&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
          state.sampleRun += 1;
          render();
        });
      }

      function buildTrajectory(seed) {
        const options = [
          [&#x27;verify&#x27;, &#x27;summarize&#x27;, &#x27;flag&#x27;, &#x27;escalate&#x27;],
          [&#x27;source&#x27;, &#x27;claim&#x27;, &#x27;caveat&#x27;, &#x27;action&#x27;],
          [&#x27;search&#x27;, &#x27;compare&#x27;, &#x27;write&#x27;, &#x27;stop&#x27;],
          [&#x27;narrow&#x27;, &#x27;expand&#x27;, &#x27;retry&#x27;, &#x27;approve&#x27;]
        ];
        const random = mulberry32(seed);
        return options.map(group =&gt; group[Math.floor(random() * group.length)]);
      }

      function renderButterfly() {
        const seedA = 3221 + state.trajectoryRun * 31;
        const seedB = state.seedLocked ? seedA : 8807 + state.trajectoryRun * 53;
        const pathA = buildTrajectory(seedA);
        const pathB = buildTrajectory(seedB);
        const sameCount = pathA.filter((value, index) =&gt; value === pathB[index]).length;
        stage.innerHTML = `
          ${lessonShell(state.seedLocked ? &#x27;same seed&#x27; : &#x27;different randomness&#x27;)}
          &lt;div class=&quot;viz-controls&quot;&gt;
            &lt;label class=&quot;form-check form-switch&quot;&gt;
              &lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot; id=&quot;ak-lock-seed&quot; ${state.seedLocked ? &#x27;checked&#x27; : &#x27;&#x27;}&gt;
              &lt;span class=&quot;form-check-label&quot;&gt;Lock the sampling seed&lt;/span&gt;
            &lt;/label&gt;
            &lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot; id=&quot;ak-rerun-paths&quot;&gt;Run again&lt;/button&gt;
          &lt;/div&gt;
          &lt;div class=&quot;ak-branch-board&quot; aria-label=&quot;Two autoregressive trajectories&quot;&gt;
            &lt;div class=&quot;ak-branch-line&quot;&gt;
              &lt;span class=&quot;ak-trace-label&quot;&gt;Run A&lt;/span&gt;
              ${pathA.map(token =&gt; `&lt;span class=&quot;ak-branch-token&quot;&gt;${token}&lt;/span&gt;`).join(&#x27;&#x27;)}
            &lt;/div&gt;
            &lt;div class=&quot;ak-branch-line alt&quot;&gt;
              &lt;span class=&quot;ak-trace-label&quot;&gt;Run B&lt;/span&gt;
              ${pathB.map(token =&gt; `&lt;span class=&quot;ak-branch-token&quot;&gt;${token}&lt;/span&gt;`).join(&#x27;&#x27;)}
            &lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;ak-two-col&quot; style=&quot;margin-top: 12px;&quot;&gt;
            &lt;div&gt;
              &lt;h3&gt;Each emitted token becomes new input&lt;/h3&gt;
              &lt;div class=&quot;ak-trace&quot; style=&quot;margin-top: 8px;&quot;&gt;
                &lt;span class=&quot;ak-step-mark&quot;&gt;prompt&lt;/span&gt;&lt;span class=&quot;ak-arrow&quot;&gt;→&lt;/span&gt;
                &lt;span class=&quot;ak-step-mark&quot;&gt;token₁&lt;/span&gt;&lt;span class=&quot;ak-arrow&quot;&gt;→&lt;/span&gt;
                &lt;span class=&quot;ak-step-mark&quot;&gt;token₂&lt;/span&gt;&lt;span class=&quot;ak-arrow&quot;&gt;→&lt;/span&gt;
                &lt;span class=&quot;ak-step-mark&quot;&gt;new logits&lt;/span&gt;
              &lt;/div&gt;
            &lt;/div&gt;
            &lt;div&gt;
              &lt;h3&gt;${sameCount}/4 decisions matched&lt;/h3&gt;
              &lt;div class=&quot;ak-risk-track&quot; style=&quot;margin-top: 12px;&quot; aria-label=&quot;Trajectory overlap&quot;&gt;
                &lt;div class=&quot;ak-risk-fill&quot; style=&quot;width: ${sameCount * 25}%&quot;&gt;&lt;/div&gt;
              &lt;/div&gt;
              &lt;div class=&quot;text-small text-muted&quot; style=&quot;margin-top: 6px;&quot;&gt;A seed controls one randomness source; model and backend drift can still break reproducibility.&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        `;
        stage.querySelector(&#x27;#ak-lock-seed&#x27;).addEventListener(&#x27;change&#x27;, event =&gt; {
          state.seedLocked = event.target.checked;
          render();
        });
        stage.querySelector(&#x27;#ak-rerun-paths&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
          state.trajectoryRun += 1;
          render();
        });
      }

      function agentTrace(run) {
        const firstTool = state.parallel ? (run === &#x27;A&#x27; ? &#x27;search_web&#x27; : &#x27;read_crm&#x27;) : &#x27;read_crm&#x27;;
        const observation = state.liveWorld
          ? (run === &#x27;A&#x27; ? &#x27;CRM: open&#x27; : &#x27;CRM: already closed&#x27;)
          : &#x27;snapshot: open&#x27;;
        const decision = state.approval
          ? (run === &#x27;A&#x27; ? &#x27;approval granted&#x27; : &#x27;approval denied&#x27;)
          : &#x27;no approval gate&#x27;;
        const effect = state.approval
          ? (run === &#x27;A&#x27; ? &#x27;send follow-up&#x27; : &#x27;stop&#x27;)
          : (observation.includes(&#x27;closed&#x27;) ? &#x27;archive task&#x27; : &#x27;send follow-up&#x27;);
        return [firstTool, observation, decision, effect];
      }

      function renderAgentLoop() {
        const a = agentTrace(&#x27;A&#x27;);
        const b = agentTrace(&#x27;B&#x27;);
        stage.innerHTML = `
          ${lessonShell(&#x27;model + loop + world&#x27;)}
          &lt;div class=&quot;viz-controls&quot;&gt;
            &lt;label class=&quot;form-check form-switch&quot;&gt;
              &lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot; id=&quot;ak-live-world&quot; ${state.liveWorld ? &#x27;checked&#x27; : &#x27;&#x27;}&gt;
              &lt;span class=&quot;form-check-label&quot;&gt;World changes between observations&lt;/span&gt;
            &lt;/label&gt;

                ${content.impacts.map(row =&gt; `
                  &lt;div class=&quot;ak-impact-row&quot;&gt;
                    &lt;span&gt;${row[0]}&lt;/span&gt;
                    &lt;div class=&quot;ak-impact-track&quot; aria-hidden=&quot;true&quot;&gt;&lt;div class=&quot;ak-impact-fill&quot; style=&quot;width: ${row[1]}%&quot;&gt;&lt;/div&gt;&lt;/div&gt;
                    &lt;span class=&quot;text-small text-muted&quot;&gt;${row[2]}&lt;/span&gt;
                  &lt;/div&gt;
                `).join(&#x27;&#x27;)}
              &lt;/div&gt;
            &lt;/section&gt;
          &lt;/div&gt;
          &lt;div class=&quot;ak-selected-detail text-small&quot;&gt;Compatibility has three levels: request syntax → response shape → behavioral semantics. Test all three with contract tests and evals.&lt;/div&gt;
        `;
        stage.querySelectorAll(&#x27;[data-api]&#x27;).forEach(button =&gt; {
          button.addEventListener(&#x27;click&#x27;, () =&gt; {
            state.api = button.dataset.api;
            render();
          });
        });
      }

      function render() {
        renderProgress();
        if (state.step === 0) renderSampler();
        if (state.step === 1) renderButterfly();
        if (state.step === 2) renderAgentLoop();
        if (state.step === 3) renderReliabilityStack();
        if (state.step === 4) renderTemporal();
        if (state.step === 5) renderApiControls();
        if (state.step === 6) renderDeviations();
      }

      back.addEventListener(&#x27;click&#x27;, () =&gt; {
        state.step = Math.max(0, state.step - 1);
        render();
      });

      next.addEventListener(&#x27;click&#x27;, () =&gt; {
        state.step = state.step === titles.length - 1 ? 0 : state.step + 1;
        render();
      });

      render();
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
